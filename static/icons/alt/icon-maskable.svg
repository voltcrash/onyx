<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Onyx</title>
  <rect width="512" height="512" fill="#1c1c1a"/>
  <g transform="translate(256 256) scale(0.72) translate(-256 -256)">
  <defs>
    <linearGradient id="body" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#2b2b31"/>
      <stop offset="0.45" stop-color="#131317"/>
      <stop offset="1" stop-color="#050507"/>
    </linearGradient>
    <linearGradient id="band-bright" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#fffefb"/>
      <stop offset="0.55" stop-color="#efeade"/>
      <stop offset="1" stop-color="#c9c3b6"/>
    </linearGradient>
    <linearGradient id="band-soft" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0" stop-color="#d8d3c7"/>
      <stop offset="1" stop-color="#8f8b81"/>
    </linearGradient>
    <linearGradient id="rim" x1="0.15" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.42"/>
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="0.75" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>
    <radialGradient id="dome" cx="0.34" cy="0.26" r="0.95">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.62"/>
    </radialGradient>
    <radialGradient id="gloss" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.72"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="cab">
      <ellipse cx="256" cy="258" rx="176" ry="152"/>
    </clipPath>
  </defs>

  <g id="stone" transform="rotate(-14 256 256) translate(256 256) scale(1.06) translate(-256 -256)">
    <ellipse cx="256" cy="258" rx="176" ry="152" fill="url(#body)"/>

    <g clip-path="url(#cab)">
      <path d="M40 158 Q150 140 258 152 Q366 164 472 144 L472 162 Q366 182 258 170 Q150 158 40 176 Z"
            fill="url(#band-soft)" opacity="0.5"/>
      <path d="M40 206 Q150 184 258 198 Q366 212 472 190 L472 246 Q366 268 258 254 Q150 240 40 262 Z"
            fill="url(#band-bright)"/>
      <path d="M40 288 Q150 270 258 282 Q366 294 472 276 L472 302 Q366 320 258 308 Q150 296 40 314 Z"
            fill="url(#band-bright)" opacity="0.86"/>

      <ellipse cx="256" cy="258" rx="176" ry="152" fill="url(#dome)"/>
      <ellipse cx="192" cy="168" rx="78" ry="42" fill="url(#gloss)" transform="rotate(-24 192 168)"/>
    </g>

    <ellipse cx="256" cy="258" rx="176" ry="152" fill="none" stroke="url(#rim)" stroke-width="5"/>
  </g>
  </g>
</svg>
