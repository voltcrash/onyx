<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="text-scale" content="scale" />
    <script nonce="%sveltekit.nonce%">
      (() => {
        const root = document.documentElement;
        const systemDark =
          typeof matchMedia === "function" && matchMedia("(prefers-color-scheme: dark)").matches;
        try {
          const storedMode = localStorage.getItem("onyx-theme");
          const preference =
            storedMode === "light" || storedMode === "dark" || storedMode === "system"
              ? storedMode
              : "system";
          root.dataset.theme =
            preference === "dark" || (preference === "system" && systemDark) ? "dark" : "light";
          root.dataset.themePreference = preference;
          root.dataset.colorTheme = localStorage.getItem("onyx-color-theme") || "monochrome";
        } catch {
          root.dataset.theme = systemDark ? "dark" : "light";
          root.dataset.themePreference = "system";
          root.dataset.colorTheme = "monochrome";
        }
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
