<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="text-scale" content="scale" />
    <script>
      // Resolve the theme before first paint so reloads never flash the wrong palette.
      try {
        const stored = localStorage.getItem("onyx-theme");
        const dark =
          stored === "dark" ||
          (stored !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        const preference = dark ? "dark" : "light";
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        document.documentElement.dataset.themePreference = preference;
        const color = localStorage.getItem("onyx-color-theme");
        document.documentElement.dataset.colorTheme = color === "monochrome" ? color : "ember";
      } catch {
        document.documentElement.dataset.theme = "light";
        document.documentElement.dataset.themePreference = "light";
        document.documentElement.dataset.colorTheme = "ember";
      }
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
