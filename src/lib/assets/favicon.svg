<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Onyx</title>
  <defs>
    <radialGradient id="body" cx="0.34" cy="0.27" r="0.92">
      <stop offset="0" stop-color="#2e333b"/>
      <stop offset="0.3" stop-color="#121417"/>
      <stop offset="0.68" stop-color="#060607"/>
      <stop offset="1" stop-color="#020203"/>
    </radialGradient>
    <linearGradient id="veil" x1="0.15" y1="0.1" x2="0.9" y2="0.95">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="gloss" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.96"/>
      <stop offset="0.3" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="0.62" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sheen" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#eaf0ff" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#eaf0ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bounce" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0.3" stop-color="#c9d2e3" stop-opacity="0"/>
      <stop offset="1" stop-color="#c9d2e3" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="edge" x1="0.1" y1="0.05" x2="0.75" y2="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip-stone">
      <circle cx="256" cy="256" r="228"/>
    </clipPath>
  </defs>

  <g id="stone" clip-path="url(#clip-stone)">
    <rect width="512" height="512" fill="url(#body)"/>

    <g fill="none" stroke-linecap="round">
      <path d="M112 432Q212 212 432 112" stroke="#8d93a0" stroke-opacity="0.18" stroke-width="46"/>
      <path d="M112 432Q212 212 432 112" stroke="#f5f8fd" stroke-opacity="0.97" stroke-width="17"/>
      <path d="M84 404Q184 184 404 84" stroke="#dbe2ee" stroke-opacity="0.42" stroke-width="6"/>
      <path d="M146 466Q246 246 466 146" stroke="#ccd4e2" stroke-opacity="0.3" stroke-width="8"/>
      <path d="M182 502Q282 282 502 182" stroke="#aab3c4" stroke-opacity="0.13" stroke-width="4"/>
    </g>

    <rect width="512" height="512" fill="url(#veil)"/>

    <ellipse cx="188" cy="168" rx="132" ry="72" transform="rotate(-45 188 168)" fill="url(#sheen)"/>
    <ellipse cx="180" cy="158" rx="78" ry="31" transform="rotate(-45 180 158)" fill="url(#gloss)"/>
    <ellipse cx="316" cy="112" rx="40" ry="15" transform="rotate(-28 316 112)" fill="url(#gloss)" opacity="0.45"/>

    <circle cx="256" cy="256" r="221" fill="none" stroke="url(#bounce)" stroke-width="14"/>
    <circle cx="256" cy="256" r="224" fill="none" stroke="url(#edge)" stroke-width="7"/>
  </g>
</svg>
